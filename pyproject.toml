[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-forecast"
version = "0.1.0"
description = "A leakage-aware MLB game win-probability application"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
  "streamlit>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
